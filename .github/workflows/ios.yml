name: Build iOS IPA

# 用法：放进你自己的任意 GitHub 仓库（路径 .github/workflows/ios.yml）→
# Actions → Build iOS IPA → Run workflow。约 10~35 分钟产出未签名 arm64 IPA。
#
# 默认构建 PR #4 的分支（ken861222/HGhub: feat/ios-support），并在构建前自动给
# scripts/ios/main.mm 追加一段原生补丁，让 WKWebView 真正铺满屏幕、消掉底部黑边。
# 不想要这段补丁：Run workflow 时把 stretch 选成 false（回到 PR 原样）。
# 补丁只改 scrollView 的 contentInset 与视图 frame，不碰 opaque / alpha / 子视图层级。
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 源码仓库（owner/name）
        required: false
        default: ken861222/HGhub
      ref:
        description: 分支 / tag / 提交 SHA
        required: false
        default: feat/ios-support
      stretch:
        description: 追加「WebView 撑满屏幕」原生补丁（修底部黑边）
        type: boolean
        required: false
        default: true

concurrency:
  group: ios-ipa
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  ios:
    name: iOS arm64 (unsigned ipa)
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: 记录构建来源
        run: |
          echo "repo: ${{ inputs.repo }}  ref: ${{ inputs.ref }}  stretch: ${{ inputs.stretch }}"
          git log -1 --format='commit %H  %ad  %s' --date=iso

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - name: 环境信息
        run: |
          xcodebuild -version
          swift --version
          node -v
          pnpm -v
          rustc -V

      - name: 追加「撑满屏幕」原生补丁
        if: ${{ inputs.stretch }}
        shell: bash
        run: |
          set -euo pipefail
          F="scripts/ios/main.mm"
          [ -f "$F" ] || { echo "::error::找不到 $F"; exit 1; }
          if grep -q 'HGFSFillWindow' "$F"; then
            echo "已打过补丁，跳过"
            exit 0
          fi
          {
            printf '%s\n' \
            '/* ═════ CI 补丁：让网页真正铺满屏幕，修掉底部约 93pt 的原生黑边 ═════' \
            ' *' \
            ' * 现象：屏幕 852pt，网页只排到 759pt = 852 − 59（顶部安全区）− 34（Home 条），' \
            ' *      剩下一条露出 WKWebView / window 的底色（PR 已刷成 #1a1a1a，于是从「白条」' \
            ' *      变成了「黑边」）。' \
            ' * 主修：WKWebView 默认 contentInsetAdjustmentBehavior = Automatic，会按安全区给' \
            ' *      scrollView 加内边距，网页可用高度因此比屏幕矮。改成 Never 并清零内边距，' \
            ' *      网页就能拿到整块屏幕；viewport-fit=cover 下 env(safe-area-inset-*) 照常' \
            ' *      有效，留白交给 CSS。' \
            ' * 兜底：若 view 的 frame 本身比屏幕矮，把 root view 撑到 window.bounds，并把' \
            ' *      root → WKWebView 这条链每层撑满父视图。' \
            ' * 只调整布局量，绝不碰 opaque / alpha / hidden / 子视图层级 —— 那是之前' \
            ' * 「视频一开始播放、画面和按钮整层消失」的原因。' \
            ' */' \
            'static UIView *HGFSFindWebView(UIView *v) {' \
            '  if ([v respondsToSelector:NSSelectorFromString(@"scrollView")]) return v;' \
            '  for (UIView *s in v.subviews) {' \
            '    UIView *hit = HGFSFindWebView(s);' \
            '    if (hit) return hit;' \
            '  }' \
            '  return nil;' \
            '}' \
            '' \
            'static void HGFSResetInset(UIView *web) {' \
            '  id sv = [web valueForKey:@"scrollView"];' \
            '  if (![sv isKindOfClass:[UIScrollView class]]) return;' \
            '  UIScrollView *sc = (UIScrollView *)sv;' \
            '  if (sc.contentInsetAdjustmentBehavior != UIScrollViewContentInsetAdjustmentNever) {' \
            '    sc.contentInsetAdjustmentBehavior = UIScrollViewContentInsetAdjustmentNever;' \
            '  }' \
            '  if (!UIEdgeInsetsEqualToEdgeInsets(sc.contentInset, UIEdgeInsetsZero)) {' \
            '    sc.contentInset = UIEdgeInsetsZero;' \
            '  }' \
            '}' \
            '' \
            '/* 把 leaf 到 top 之间的每一层视图撑满各自父视图。' \
            '   只改 frame / autoresizingMask，不动 translatesAutoresizingMaskIntoConstraints，' \
            '   避免和工程里已有的 Auto Layout 约束打架。 */' \
            'static void HGFSFillChain(UIView *leaf, UIView *top) {' \
            '  UIView *v = leaf;' \
            '  while (v && v != top) {' \
            '    UIView *p = v.superview;' \
            '    if (!p) break;' \
            '    if (!CGRectEqualToRect(v.frame, p.bounds)) v.frame = p.bounds;' \
            '    v.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;' \
            '    v = p;' \
            '  }' \
            '}' \
            '' \
            'static void HGFSFillWindow(UIWindow *w) {' \
            '  UIView *root = w.rootViewController.view;' \
            '  if (!root) return;' \
            '  if (!CGRectEqualToRect(root.frame, w.bounds)) root.frame = w.bounds;' \
            '  UIView *web = HGFSFindWebView(root);' \
            '  if (!web) return;' \
            '  HGFSResetInset(web);' \
            '  HGFSFillChain(web, root);' \
            '}' \
            '' \
            'static void HGFSApply(void) {' \
            '  for (UIScene *scene in UIApplication.sharedApplication.connectedScenes) {' \
            '    if (![scene isKindOfClass:[UIWindowScene class]]) continue;' \
            '    for (UIWindow *w in ((UIWindowScene *)scene).windows) {' \
            '      if (w.windowLevel != UIWindowLevelNormal) continue;' \
            '      HGFSFillWindow(w);' \
            '    }' \
            '  }' \
            '}' \
            '' \
            'static void HGFSApplyAfter(double delay) {' \
            '  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(delay * NSEC_PER_SEC)),' \
            '                 dispatch_get_main_queue(), ^{ HGFSApply(); });' \
            '}' \
            '' \
            '__attribute__((constructor))' \
            'static void HGFSInstall(void) {' \
            '  dispatch_async(dispatch_get_main_queue(), ^{' \
            '    for (NSNumber *d in @[@0.05, @0.15, @0.35, @0.8, @1.5, @2.5]) {' \
            '      HGFSApplyAfter(d.doubleValue);' \
            '    }' \
            '  });' \
            '  [[NSNotificationCenter defaultCenter]' \
            '    addObserverForName:UIApplicationDidBecomeActiveNotification' \
            '                object:nil' \
            '                 queue:[NSOperationQueue mainQueue]' \
            '            usingBlock:^(NSNotification * _Nonnull note) {' \
            '              HGFSApplyAfter(0.2);' \
            '              HGFSApplyAfter(1.0);' \
            '            }];' \
            '  [[NSNotificationCenter defaultCenter]' \
            '    addObserverForName:UIDeviceOrientationDidChangeNotification' \
            '                object:nil' \
            '                 queue:[NSOperationQueue mainQueue]' \
            '            usingBlock:^(NSNotification * _Nonnull note) {' \
            '              HGFSApplyAfter(0.3);' \
            '              HGFSApplyAfter(0.8);' \
            '            }];' \
            '}'
          } >> "$F"
          echo "--- 补丁尾部 ---"
          tail -6 "$F"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 iOS 工程
        run: pnpm tauri ios init --ci

      - name: 构建未签名 IPA
        env:
          IPA_OUT: ${{ github.workspace }}/HGhub-unsigned.ipa
        run: pnpm ios:ipa

      - name: 校验产物
        shell: bash
        run: |
          set -euo pipefail
          IPA="HGhub-unsigned.ipa"
          [ -f "$IPA" ] || { echo "::error::没有产出 IPA"; exit 1; }
          ls -lh "$IPA"
          rm -rf /tmp/ipa-check && mkdir -p /tmp/ipa-check
          unzip -q "$IPA" -d /tmp/ipa-check
          APP="$(find /tmp/ipa-check/Payload -maxdepth 1 -name '*.app' -print -quit)"
          EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          lipo -info "$APP/$EXEC"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          # 不要写 `strings ... | grep -q`：grep -q 命中即退出，strings 会吃 SIGPIPE，
          # 在 pipefail 下整条管道判失败，会假报「白屏」。
          if ! grep -aq '/assets/index-' "$APP/$EXEC"; then
            echo "::error::前端资源没有内嵌到二进制，装上去会白屏"
            exit 1
          fi
          echo "OK: 前端资源已内嵌，bundle 结构正常"

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-ios-ipa
          path: HGhub-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 收尾提示
        run: |
          {
            echo "### 构建完成"
            echo ""
            echo "- 源码：\`${{ inputs.repo }}\` @ \`${{ inputs.ref }}\`"
            echo "- 撑满屏幕补丁：\`${{ inputs.stretch }}\`"
            echo ""
            echo "产物是 **未签名** IPA，要先用自己的 Apple ID 重签："
            echo ""
            echo "1. Windows 装 [Sideloadly](https://sideloadly.io/)（iTunes 用官网版，别用 Microsoft Store 版）"
            echo "2. IPA 拖进去 → 填 Apple ID → Start"
            echo "3. 手机 设置 → 通用 → VPN与设备管理 → 信任该描述文件"
            echo ""
            echo "免费 Apple ID 签出来的 app **7 天失效**，到期重签一次。"
          } >> "$GITHUB_STEP_SUMMARY"
