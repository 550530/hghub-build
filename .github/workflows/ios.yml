name: Build iOS IPA

# 用法：放进你自己的任意 GitHub 仓库（路径 .github/workflows/ios.yml）→
# Actions → Build iOS IPA → Run workflow。约 10~35 分钟产出未签名 arm64 IPA。
#
# 构建源码：PR #4 的分支（ken861222/HGhub: feat/ios-support），与作者原样一致，
# 不打任何原生补丁。
#
# 唯一附加动作：构建前给 src/pages/Home.tsx 打一个「随机顺序」补丁
#   - 首页原来是 api.feed(p, 10) 按服务器返回顺序累加，播放器永远从第 0 条起播，
#     所以每次打开都是同一部、同一顺序；
#   - 补丁把每一页返回的视频随机打散后再拼进列表，于是每次进 App 起播的那部不一样。
# 补丁只是纯前端洗牌，不改数据、不改接口。不想用就把 random 选成 false。
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 源码仓库（owner/name）
        required: false
        default: ken861222/HGhub
      ref:
        description: 分支 / tag / 提交 SHA
        required: false
        default: feat/ios-support
      random:
        description: 首页视频随机顺序
        type: boolean
        required: false
        default: true

concurrency:
  group: ios-ipa
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  ios:
    name: iOS arm64 (unsigned ipa)
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: 记录构建来源
        run: |
          echo "repo: ${{ inputs.repo }}  ref: ${{ inputs.ref }}  random: ${{ inputs.random }}"
          git log -1 --format='commit %H  %ad  %s' --date=iso

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - name: 环境信息
        run: |
          xcodebuild -version
          swift --version
          node -v
          pnpm -v
          rustc -V

      - name: 打「首页随机顺序」补丁
        if: ${{ inputs.random }}
        shell: bash
        run: |
          set -euo pipefail
          F="src/pages/Home.tsx"
          [ -f "$F" ] || { echo "::error::找不到 $F"; exit 1; }
          if grep -q 'shuffleIncoming' "$F"; then
            echo "已打过补丁，跳过"
            exit 0
          fi
          n="$(grep -c 'const list = res?.items || \[\];' "$F" || true)"
          if [ "$n" != "1" ]; then
            echo "::error::锚点匹配 $n 次（应为 1），源码结构可能变了"
            exit 1
          fi
          perl -0pi -e 's/const list = res\?\.items \|\| \[\];/const list = shuffleIncoming(res?.items || []);/' "$F"
          m="$(grep -c 'const list = shuffleIncoming' "$F" || true)"
          if [ "$m" != "1" ]; then
            echo "::error::替换没有生效（匹配 $m 次），perl 替换失败"
            exit 1
          fi
          {
            printf '%s\n' \
              '' \
              '/* ── CI 补丁：把每一页返回的视频随机打散，避免每次打开都是同一部、同一顺序 ── */' \
              'function shuffleIncoming<T>(arr: T[]): T[] {' \
              '  const a = arr.slice();' \
              '  for (let i = a.length - 1; i > 0; i--) {' \
              '    const j = Math.floor(Math.random() * (i + 1));' \
              '    const t = a[i];' \
              '    a[i] = a[j];' \
              '    a[j] = t;' \
              '  }' \
              '  return a;' \
              '}'
          } >> "$F"
          echo "--- 补丁落点 ---"
          grep -n 'shuffleIncoming' "$F" | head -3

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 iOS 工程
        run: pnpm tauri ios init --ci

      - name: 构建未签名 IPA
        env:
          IPA_OUT: ${{ github.workspace }}/HGhub-unsigned.ipa
        run: pnpm ios:ipa

      - name: 校验产物
        shell: bash
        run: |
          set -euo pipefail
          IPA="HGhub-unsigned.ipa"
          [ -f "$IPA" ] || { echo "::error::没有产出 IPA"; exit 1; }
          ls -lh "$IPA"
          rm -rf /tmp/ipa-check && mkdir -p /tmp/ipa-check
          unzip -q "$IPA" -d /tmp/ipa-check
          APP="$(find /tmp/ipa-check/Payload -maxdepth 1 -name '*.app' -print -quit)"
          EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          lipo -info "$APP/$EXEC"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          # 不要写 `strings ... | grep -q`：grep -q 命中即退出，strings 会吃 SIGPIPE，
          # 在 pipefail 下整条管道判失败，会假报「白屏」。
          if ! grep -aq '/assets/index-' "$APP/$EXEC"; then
            echo "::error::前端资源没有内嵌到二进制，装上去会白屏"
            exit 1
          fi
          echo "OK: 前端资源已内嵌，bundle 结构正常"

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-ios-ipa
          path: HGhub-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 收尾提示
        run: |
          {
            echo "### 构建完成"
            echo ""
            echo "- 源码：\`${{ inputs.repo }}\` @ \`${{ inputs.ref }}\`"
            echo "- 首页随机顺序：\`${{ inputs.random }}\`"
            echo ""
            echo "产物是 **未签名** IPA，要先用自己的 Apple ID 重签："
            echo ""
            echo "1. Windows 装 [Sideloadly](https://sideloadly.io/)（iTunes 用官网版，别用 Microsoft Store 版）"
            echo "2. IPA 拖进去 → 填 Apple ID → Start"
            echo "3. 手机 设置 → 通用 → VPN与设备管理 → 信任该描述文件"
            echo ""
            echo "免费 Apple ID 签出来的 app **7 天失效**，到期重签一次。"
          } >> "$GITHUB_STEP_SUMMARY"
